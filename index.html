<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charaset="utf-8"/>
        <title>My snowglobe</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class="hero">
        <h1>My Winter snowglobe</h1>
        <p class="tagline">Shake it for a litte winter kindness.</p>
        </header>
        <main>
            <section class="globe-card">
            <div class="globe" id="globe">
                <img class="scene" src="CoffeeCup.png" alt="a snowglobe"/>
                <button id="shake">shake the globe</button>
                <p class="message" id="message">press the button to shake</p>
            </div>
            </section>
        </main>
        <footer>
            <p>Made by Chazlynnlove, desperately trying to ship even an hour.</p>
            <script src="script.js"></script>
        </footer>
    </body>
</html>
